# ─────────────────────────────────────────────────────────────────────────
# Agentic OS — Hostinger VPS deployment
#
# Usage on the VPS (4 commands):
#   git clone https://github.com/Joetexas42/Hermes-Joetexas.git agentic-os
#   cd agentic-os
#   cp .env.example .env       # then edit and set AGENTIC_OS_PASSWORD
#   docker compose up -d --build
#
# Traefik (already running on the VPS in network_mode: host) auto-discovers
# this container via the labels below and serves it at:
#   https://agentic-os.srv1344233.hstgr.cloud
# ─────────────────────────────────────────────────────────────────────────

services:
  agentic-os:
    build: .
    image: agentic-os:latest
    container_name: agentic-os
    restart: unless-stopped

    environment:
      # Single-user password (required). Without it, auth is disabled.
      AGENTIC_OS_PASSWORD: ${AGENTIC_OS_PASSWORD:?set AGENTIC_OS_PASSWORD in .env}
      # Optional: separate signing secret for cookies. Defaults to password.
      AGENTIC_OS_SECRET:   ${AGENTIC_OS_SECRET:-}

      # Vault path inside the container — persists via the .data volume.
      AGENTIC_OS_VAULT:    ${AGENTIC_OS_VAULT:-/app/.data/vault}

      # Where the dashboard's Hermes chat talks to (public web UI, for the iframe embed).
      AGENTIC_OS_HERMES_URL: ${AGENTIC_OS_HERMES_URL:-https://hermes-agent-gn0b.srv1344233.hstgr.cloud}

      # Where the dashboard's chat client sends OpenAI-compatible requests.
      # On the VPS this points cross-container at the Hermes proxy running inside
      # the hermes-agent-gn0b container on port 8645 (started via `hermes proxy start`).
      AGENTIC_OS_HERMES_PROXY: ${AGENTIC_OS_HERMES_PROXY:-http://hermes-agent-gn0b-hermes-agent-1:8645/v1}
      AGENTIC_OS_HERMES_TOKEN: ${AGENTIC_OS_HERMES_TOKEN:-hermes}

      # Google Gemini API key (free tier: 2M tokens/day on 2.5 Flash).
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

      NODE_ENV: production
      PORT: "3000"

    volumes:
      # Persistent state: Kanban SQLite, vault, goals, journal, swarm, settings.
      - agentic-os-data:/app/.data

    networks:
      - default
      - hermes-net

    labels:
      - "traefik.enable=true"
      # Subdomain routing — matches the wildcard DNS Hostinger has for *.srv1344233.hstgr.cloud
      - "traefik.http.routers.agentic-os.rule=Host(`agentic-os.srv1344233.hstgr.cloud`)"
      - "traefik.http.routers.agentic-os.entrypoints=websecure"
      - "traefik.http.routers.agentic-os.tls=true"
      - "traefik.http.routers.agentic-os.tls.certresolver=letsencrypt"
      - "traefik.http.services.agentic-os.loadbalancer.server.port=3000"

volumes:
  agentic-os-data:

networks:
  # Project's own private network for the container.
  default:
  # External network created by the hermes-agent-gn0b compose project.
  # Joining it lets us reach the Hermes container by its DNS name.
  hermes-net:
    name: hermes-agent-gn0b_default
    external: true
