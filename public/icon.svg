<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1625"/>
      <stop offset="100%" stop-color="#0d0b14"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#d4a574"/>
      <stop offset="100%" stop-color="#c97c5e"/>
    </linearGradient>
    <linearGradient id="core" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f6b73c"/>
      <stop offset="100%" stop-color="#e8389b"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  <!-- Outer ring -->
  <circle cx="256" cy="256" r="170" fill="none" stroke="url(#ring)" stroke-width="6" opacity="0.5"/>
  <!-- Orbital dots -->
  <circle cx="256" cy="86" r="10" fill="#d4a574" opacity="0.8"/>
  <circle cx="403" cy="341" r="8" fill="#8b5cf6" opacity="0.7"/>
  <circle cx="109" cy="341" r="8" fill="#e8389b" opacity="0.7"/>
  <circle cx="370" cy="140" r="7" fill="#34d399" opacity="0.6"/>
  <circle cx="142" cy="140" r="7" fill="#f5a524" opacity="0.6"/>
  <!-- Core glow -->
  <circle cx="256" cy="256" r="60" fill="url(#core)" opacity="0.15"/>
  <!-- Core -->
  <circle cx="256" cy="256" r="36" fill="url(#core)"/>
  <!-- "A" letter -->
  <text x="256" y="272" text-anchor="middle" font-family="system-ui, sans-serif" font-weight="700" font-size="44" fill="#0d0b14">A</text>
</svg>
